[build]
  # vendor/ 不進 Git，要先 composer install；再 npm 建置與 Jigsaw 產出 build_production
  command = "composer install --no-interaction --prefer-dist && npm run build && php vendor/bin/jigsaw build production"
  publish = "build_production"

[build.environment]
  NODE_VERSION = "22"
  PHP_VERSION = "8.2"
