<script type="application/json" id="support-faq-data">
    {"capability":"support.manage","createUrl":"/support/faq/","listUrl":"/support/","locales":["TW","EN","JP"],"types":[{"value":"incident","label":"異常排除"},{"value":"ops","label":"操作使用"},{"value":"access","label":"權限設定"},{"value":"deploy","label":"安裝部署"}],"modules":[{"value":"mac","label":"MACManager"},{"value":"ip","label":"IPLocator"},{"value":"arp","label":"ARPScanner"},{"value":"dhcp","label":"DHCPManager"},{"value":"portal","label":"夥伴入口"}],"faqs":[{"id":"faq-mac-duplicate","type":"incident","module":"mac","question":"當相同 MAC 出現時，UPAS 可以同時阻斷兩者或只阻斷攻擊者嗎？","answer":"<p>可以依政策選擇。系統偵測到相同 MAC 出現在不同埠或不同位置時，預設會標示衝突並依「衝突處置」設定處理。</p><ul><li><strong>僅阻斷攻擊者：</strong>保留先註冊或已核准的合法裝置，阻斷後續冒用來源。</li><li><strong>同時阻斷兩者：</strong>適用於無法判斷誰是合法裝置、需先隔離再人工放行的環境。</li></ul><p>建議先在測試網段驗證政策，再套用到生產網段，避免誤阻關鍵設備。</p>"},{"id":"faq-rbac","type":"access","module":"portal","question":"角色的存取控制 (RBAC) 如何運作？","answer":"<p>Partners Portal 以角色決定可見選單與可執行操作。總管理者可審核商機、管理夥伴資料；一般使用者以報備、查詢、下載資源與開立技術工單為主。</p><ul><li>同一公司可有多位使用者，權限依角色而非個人帳號硬編碼。</li><li>技術工單開立後，處理人員由原廠指派，夥伴端可追蹤狀態但不可自行改狀態。</li></ul><p>若需要調整既有帳號角色，請由總管理者於夥伴資料提出，或開立權限類工單。</p>"},{"id":"faq-asset-missing","type":"incident","module":"ip","question":"部分網路設備未出現在資產盤點清單怎麼排查？","answer":"<p>常見原因是盤點範圍未涵蓋該網段、裝置離線，或被現有過濾條件排除。</p><ol><li>確認 Sensor／掃描器是否涵蓋該 VLAN 或實體網段。</li><li>檢查設備當下是否在線，離線裝置需等下次掃描或改為被動蒐集。</li><li>核對排除清單、過濾條件與認證範圍。</li></ol><p>若範圍設定正確仍缺資料，請附上網段資訊與設備範例開立工單。</p>"},{"id":"faq-sensor-vlan","type":"incident","module":"arp","question":"Sensor 無法接收指定 VLAN 的設備資訊？","answer":"<p>請先確認交換器已把該 VLAN 的流量鏡像或允許 Sensor 所在埠接收 ARP／相關封包。</p><ul><li>Trunk 是否允許目標 VLAN</li><li>SPAN／RSPAN 來源是否包含該 VLAN</li><li>Sensor 介面 VLAN 與管理位址是否正確</li></ul><p>完成網路側確認後，再到主控台查看該 Sensor 的即時流量與最近一次心跳。</p>"},{"id":"faq-dhcp-conflict","type":"incident","module":"dhcp","question":"DHCP 租約衝突時應如何處理？","answer":"<p>先在 DHCPManager 找出衝突位址、租約來源與時間，再決定是回收租約或調整範圍。</p><ul><li>確認是否有第二台 DHCP 在同一網段發放</li><li>固定／浮動位址區段是否重疊</li><li>裝置是否使用過期的自行設定位址</li></ul><p>大型環境建議先處理單一網段，確認無誤再擴到全區。</p>"},{"id":"faq-mac-guest","type":"ops","module":"mac","question":"MAC 准入政策生效後，訪客仍無法上網？","answer":"<p>請依序檢查訪客是否已取得暫時許可、對應的 VLAN／ACL 是否放行，以及認證頁是否可開啟。</p><ul><li>訪客 MAC 是否已出現在待核准清單</li><li>暫時上網時段是否已過期</li><li>交換器是否有把未認證流量導向導引網段</li></ul><p>現場排查時建議同時提供交換器埠號與訪客裝置 MAC。</p>"},{"id":"faq-ip-scope","type":"deploy","module":"ip","question":"首次安裝後如何確認盤點範圍？","answer":"<p>安裝完成後，先用一個已知網段做驗證，確認清單數量與現場資產大致相符，再擴大範圍。</p><ol><li>設定掃描或被動蒐集的網段清單</li><li>對照現有 IP 表或 DHCP 範圍</li><li>標記不明裝置與離線裝置，避免一次當成異常</li></ol><p>POC 建議選擇非關鍵網段，降低對營運的影響。</p>"},{"id":"faq-portal-role","type":"access","module":"portal","question":"如何為夥伴入口帳號指定角色？","answer":"<p>新帳號預設為一般使用者。若需改為總管理者，請由既有總管理者於夥伴資料提出，或開立「權限設定」工單並註明公司統編與帳號信箱。</p><p>角色變更會影響商機審核、匯出與夥伴資料維護等操作，請避免多人同時擁有不必要的最高權限。</p>"},{"id":"faq-mac-export","type":"ops","module":"mac","question":"如何匯出 MAC 准入與阻斷紀錄？","answer":"<p>在 MACManager 的紀錄頁選擇時間範圍與結果類型後即可匯出。建議先篩選網段或政策，再下載，避免一次帶出過大的檔案。</p><ul><li>可用 CSV 交給現場核對交換器埠位</li><li>阻斷紀錄請一併保留政策名稱與生效時間</li></ul><p>若匯出欄位與現場報表不一致，請開立操作使用類工單並附上範例檔。</p>"},{"id":"faq-dhcp-apply","type":"ops","module":"dhcp","question":"調整 DHCP 範圍後，新設定何時會生效？","answer":"<p>範圍與選項變更會先寫入待發布設定，需發布後才會套用到對應網段。既有租約通常等到續約或到期才改用新範圍。</p><ol><li>確認發布對象是正確的 DHCP 服務或站點</li><li>觀察新裝置是否取得新範圍的位址</li><li>舊裝置可在維護時段手動更新租約</li></ol><p>正式環境建議先在測試網段發布，確認無誤再擴大。</p>"},{"id":"faq-arp-compare","type":"ops","module":"arp","question":"ARPScanner 與 IPLocator 的資料不一致怎麼對照？","answer":"<p>兩者蒐集來源不同：ARPScanner 偏即時流量，IPLocator 則含掃描與既有資產。短暫不一致很常見，先對時間與網段再判斷是否異常。</p><ul><li>比對同一 VLAN、同一時間窗的清單</li><li>確認其中一邊是否被排除清單過濾</li><li>離線或靜音裝置可能只出現在盤點結果</li></ul><p>若同一網段長期落差很大，請附上兩個模組的匯出與交換器資訊開立工單。</p>"},{"id":"faq-portal-manual","type":"ops","module":"portal","question":"夥伴入口的故障排除手冊要在哪裡下載？","answer":"<p>技術支援中心最下方的「檔案下載」可取得手冊與相關連結。下載前請確認帳號已通過審核，否則部分資源會被權限隱藏。</p><p>若清單沒有你需要的版本，請開立工單並註明產品與版號，由原廠補上後即可再下載。</p>"}],"copy":{"headingNew":"新增 FAQ","headingEdit":"編輯 FAQ","sectionTitle":"FAQ 資料","asideNew":"發布 FAQ","asideEdit":"儲存變更","asideHelp":"發布後會出現在技術支援中心。此為示意流程，資料存在此瀏覽器。","submitNew":"發布 FAQ","submitEdit":"儲存變更","savedNew":"已發布 FAQ","savedEdit":"已儲存 FAQ"}}
</script>
