<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>公司名稱</title>
    <meta name="description" content="公司描述">
    <!-- Custom CSS (which will include Tailwind directives) -->
    <link rel="stylesheet" href="./app.css">
    <!-- Remixicon Icon font -->
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet" />
    <!-- AOS 動畫庫 CSS CDN -->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet" />
</head>

<body class="bg-bg text-main1 font-sans selection:bg-main2 selection:text-white">

    <!-- 用於展示 grid 斷點與 padding 設定的區塊 -->
    <main class="layout-grid bg-bg min-h-screen py-16 gap-8 items-center text-center">
        <div data-aos="fade-up" data-aos-duration="1000" class="bg-gray1 text-main1 p-8 rounded">
            <h1 class="text-h1 font-medium text-main1 mb-4">公司名稱</h1>
            <p class="text-b2 font-semibold text-gray4 mb-8">公司描述</p>
            
            <div class="flex gap-4 justify-center">
                <a href="#" class="btn-primary">
                    <span>Explore</span>
                    <i class="ri-arrow-right-line"></i>
                </a>
            </div>
        </div>
    </main>

    <!-- AOS 動畫庫 JS CDN -->
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js" defer></script>
    <!-- Lenis 平滑滾動 JS CDN -->
    <script src="https://unpkg.com/@studio-freight/lenis@1.0.34/dist/lenis.min.js" defer></script>
    <!-- Global JS (初始化全域套件) -->
    <script src="./js/global.js" defer></script>
</body>

</html>
